name: android

# GitHub Actions is the compiler gate: the sandbox that writes the code has no
# JDK/Android SDK, so every push and pull request builds the debug APK here.
on:
  push:
    branches: ['arena/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unit tests (JVM)
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee gradle-test.log

      # The Actions log endpoint is unreliable; the job summary is always readable
      # from the API, so compiler errors are published here too.
      - name: Publish compiler output
        if: always()
        run: |
          {
            echo "## gradle output"
            echo '```'
            grep -E "^e: |^w: |error:|FAILURE|BUILD |Unresolved|Caused by" gradle-test.log | head -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are readable from the check-runs API even when the raw
          # job log blob cannot be fetched.
          # FIRST the lines after "What went wrong", then compiler errors, then anything test-ish.
          {
            awk '/What went wrong/,/Try:/' gradle-test.log | head -n 25
            grep -E "^e: |^error:" gradle-test.log | head -n 10
            grep -E "[0-9]+ tests? completed|FAILED|AssertionError|expected:" gradle-test.log | head -n 20
          } | while IFS= read -r line; do echo "::error::$(echo "$line" | cut -c1-900)"; done || true

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee -a gradle-test.log

      - name: Publish build output
        if: always()
        run: |
          {
            echo "## assemble output"
            echo '```'
            grep -E "^e: |^w: |error:|FAILURE|BUILD |Unresolved|Caused by" gradle-test.log | head -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are readable from the check-runs API even when the raw
          # job log blob cannot be fetched.
          # FIRST the lines after "What went wrong", then compiler errors, then anything test-ish.
          {
            awk '/What went wrong/,/Try:/' gradle-test.log | head -n 25
            grep -E "^e: |^error:" gradle-test.log | head -n 10
            grep -E "[0-9]+ tests? completed|FAILED|AssertionError|expected:" gradle-test.log | head -n 20
          } | while IFS= read -r line; do echo "::error::$(echo "$line" | cut -c1-900)"; done || true

      - name: Verify the APK exists and is signed
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          ls -lh "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

          # The APK's own manifest is the truth about identity and SDK floors.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label)" || true

      # The concept forbids invented numbers and force-stop claims. The honest
      # disclaimer ("It never force-stops apps") is allowed; a claim is not.
      - name: No forbidden claims in the shipped APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          # Dump only the string resources that ship to the user, then drop the
          # negated disclaimers, which are the opposite of a claim.
          "$AAPT" dump strings "$APK" \
            | sed -E 's/(never|no|not)[[:space:]]+force[[:space:]]*-?[[:space:]]*stops?//Ig' \
            > /tmp/shipped-strings.txt
          if grep -inE "force[[:space:]]*-?[[:space:]]*stop|boost|gb freed|free[[:space:]]+up" /tmp/shipped-strings.txt; then
            echo "::error::forbidden claim found in the APK"; exit 1
          fi
          if grep -nE "\bRAM\b|\bMB\b" /tmp/shipped-strings.txt; then
            echo "::error::memory figure in the APK"; exit 1
          fi
          echo "no forbidden claims in the APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: killer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
